<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>React Native Hub – SPA</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">

  <!-- Vue 3 -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>

  <!-- Vue Router 4-->
  <script src="https://unpkg.com/vue-router@4"></script>

  <!-- Axios -->
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>
  <div id="app"></div>
    <div class="d-flex flex-column min-vh-100">
      <header class="py-3 mb-3">
        <div class="container d-flex justify-content-between align-items-center">
          <div class="d-flex align-items-center gap-2">
            <img src="images/react-native-icona.png" alt="React Logo" class="logo-react">
            <h1 class="h4 m-0">React Native Hub</h1>
          </div>
          <nav>
            <ul class="nav">
              <li class="nav-item">
                <router-link class="nav-link" to="/">Home</router-link>
              </li>
              <li class="nav-item">
                <router-link class="nav-link" to="/fondamenti">Fondamenti</router-link>
              </li>
              <li class="nav-item">
                <router-link class="nav-link" to="/gamedex">GameDex</router-link>
              </li>
              <li class="nav-item">
                <router-link class="nav-link" to="/esami">Esami</router-link>
              </li>
            </ul>
          </nav>
        </div>
      </header>
 
      <main class="flex-grow-1">
        <div class="container mb-4">
          <router-view></router-view>
        </div>
      </main>
 
      <footer class="py-3 mt-auto">
        <p class="text-center m-0 small">
          Fondamenti di Sistemi Web – A.A. 2024/2025
        </p>
      </footer>
    </div>
  </div>
 
  <script src="app.js"></script>
</body>
</html>
